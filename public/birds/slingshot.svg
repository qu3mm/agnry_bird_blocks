<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120">
  <!-- Slingshot -->
  <!-- Base / handle -->
  <rect x="34" y="70" width="12" height="46" rx="6" fill="#7d4e1f"/>
  <rect x="36" y="72" width="4" height="42" rx="2" fill="#a0622a" opacity="0.5"/>
  <!-- Left fork -->
  <path d="M40 72 Q20 50 18 20" fill="none" stroke="#7d4e1f" stroke-width="10" stroke-linecap="round"/>
  <path d="M40 72 Q20 50 18 20" fill="none" stroke="#a0622a" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Right fork -->
  <path d="M40 72 Q60 50 62 20" fill="none" stroke="#7d4e1f" stroke-width="10" stroke-linecap="round"/>
  <path d="M40 72 Q60 50 62 20" fill="none" stroke="#a0622a" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Fork tips -->
  <circle cx="18" cy="20" r="6" fill="#5c3317"/>
  <circle cx="62" cy="20" r="6" fill="#5c3317"/>
  <!-- Rubber bands -->
  <path d="M18 20 Q40 38 62 20" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round" stroke-dasharray="none" opacity="0.8"/>
  <path d="M18 20 Q40 38 62 20" fill="none" stroke="#D2691E" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
